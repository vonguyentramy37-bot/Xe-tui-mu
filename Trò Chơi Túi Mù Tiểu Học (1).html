button{font-family:inherit;cursor:pointer}
/* vùng bấm trên 4 túi */
.bag{position:absolute;border:0;background:transparent;border-radius:30% 30% 22% 22%;transition:transform .2s,box-shadow .2s}
.bag::after{content:"";position:absolute;inset:-2%;border-radius:inherit;border:.5cqw solid rgba(255,255,255,.0);animation:ring 2.4s ease-in-out infinite}
@keyframes ring{50%{border-color:rgba(255,255,255,.85);transform:scale(1.03)}}
.bag:hover,.bag:focus-visible{transform:translateY(-1.2cqw) scale(1.04);box-shadow:0 0 0 .6cqw #fff,0 0 3cqw .5cqw #ffe45e;outline:none}
.bag.done{background-image:var(--clean);background-repeat:no-repeat;border-radius:0;pointer-events:none;animation:fade .8s}
.bag.done::after{display:none}
.mini{position:absolute;top:1.5cqw;width:5.2cqw;height:5.2cqw;min-width:64px;min-height:64px;border-radius:50%;border:.4cqw solid #fff;background:#ff9a3c;font-size:2.6cqw;box-shadow:0 .4cqw 0 #c7691a;z-index:3}
#snd{right:1.5cqw}#rst{right:8cqw}
/* màn mở túi */
#ov,#end{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:space-evenly;z-index:5;
 background:repeating-conic-gradient(from 0deg at 50% 45%,rgba(255,255,255,.6) 0 7.5deg,transparent 7.5deg 15deg),linear-gradient(#aee3ff,#fff4cf);animation:fade .35s}
#ov.on,#end.on{display:flex}
@keyframes fade{from{opacity:0}}
.back{position:absolute;left:1.5cqw;top:1.5cqw;font-size:2cqw;font-weight:800;padding:.8cqw 2cqw;border-radius:99px;border:.4cqw solid #fff;background:#8a5cf6;color:#fff;box-shadow:0 .4cqw 0 #5b34b8;min-height:64px}
#ttl{font-size:3.4cqw;font-weight:900;color:#e0457b;-webkit-text-stroke:.25cqw #fff;paint-order:stroke fill;text-shadow:0 .3cqw 0 rgba(0,0,0,.12)}
#zone{display:grid;place-items:center;width:100%;height:21cqw}
#zone>*{grid-area:1/1}
#bagwrap{position:relative;width:19cqw;height:22cqw}
#bagwrap.shake{animation:shake .9s ease-in-out}
@keyframes shake{0%,100%{transform:rotate(0)}15%{transform:rotate(-9deg) scale(1.05)}35%{transform:rotate(9deg) scale(1.08)}55%{transform:rotate(-11deg) scale(1.1)}75%{transform:rotate(8deg) scale(1.12)}}
.half{position:absolute;inset:0;width:100%;height:100%;transition:transform .7s ease-in,opacity .7s;filter:drop-shadow(0 .8cqw .6cqw rgba(0,0,0,.2))}
.half.l{clip-path:polygon(0 0,52% 0,46% 12%,54% 24%,45% 36%,53% 50%,46% 64%,54% 78%,47% 100%,0 100%)}
.half.r{clip-path:polygon(52% 0,100% 0,100% 100%,47% 100%,54% 78%,46% 64%,53% 50%,45% 36%,54% 24%,46% 12%)}
#bagwrap.tear .l{transform:translate(-22cqw,6cqw) rotate(-35deg);opacity:0}
#bagwrap.tear .r{transform:translate(22cqw,6cqw) rotate(35deg);opacity:0}
#words{display:flex;gap:2cqw;align-items:center;justify-content:center}
.card{padding:.2cqw 3cqw 1cqw;font-size:10cqw;white-space:nowrap;line-height:1.25;font-weight:900;text-align:center;border-radius:3cqw;background:var(--c);color:var(--t);border:.7cqw solid #fff;box-shadow:0 1cqw 0 rgba(0,0,0,.18),0 0 3cqw rgba(255,255,255,.9);animation:pop .55s cubic-bezier(.3,1.6,.5,1) both}
@keyframes pop{0%{transform:scale(0) rotate(-14deg)}100%{transform:scale(1) rotate(0)}}
#spell{min-height:6cqw;display:flex;gap:1.2cqw;align-items:center;font-size:3.6cqw;font-weight:800;color:#d6336c}
#spell span{padding:.2cqw 1.8cqw;border-radius:99px;background:#fff;border:.3cqw solid #ffc2d9;transition:transform .2s,background .2s}
#spell span.on{background:#ff4fa3;color:#fff;transform:scale(1.2)}
.w{display:inline-block;padding:0 1.2cqw;border-radius:2cqw;transition:transform .25s,background .25s}
.w.hl{transform:translateY(-1cqw) scale(1.08);background:rgba(255,255,255,.4)}
.btn:disabled{opacity:.6;cursor:default}
#msg,#acts{visibility:hidden}
#msg.on,#acts.on{visibility:visible;animation:fade .5s}
#msg{font-size:3cqw;font-weight:800;color:#1b6fd1;background:#fff;padding:.5cqw 3cqw;border-radius:99px;box-shadow:0 .4cqw 0 rgba(0,0,0,.12)}
#acts{display:flex;gap:2cqw}
.btn{font-size:2.6cqw;font-weight:800;color:#fff;padding:1cqw 3cqw;min-height:64px;border-radius:99px;border:.45cqw solid #fff;background:linear-gradient(#4cd964,#22b04a);box-shadow:0 .6cqw 0 #14803a}
.btn.say{background:linear-gradient(#ffb340,#ff8a1f);box-shadow:0 .6cqw 0 #c4630d}
.btn:hover,.mini:hover,.back:hover{filter:brightness(1.08);transform:translateY(-.2cqw)}
#end h1{font-size:6.5cqw;font-weight:900;color:#ff4fa3;-webkit-text-stroke:.4cqw #fff;paint-order:stroke fill}
#end p{font-size:3cqw;font-weight:800;color:#1b6fd1}
#chips{display:flex;gap:1.6cqw}
#chips span{white-space:nowrap;font-size:3cqw;font-weight:800;padding:.6cqw 2cqw;border-radius:99px;background:var(--c);color:var(--t);border:.4cqw solid #fff}
.fx{position:absolute;left:50%;top:44%;font-size:4cqw;pointer-events:none;z-index:9;animation:fly 1.3s ease-out forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
</style>
</head>
<body>
<div id="stage">
  <div id="bags"></div>
  <button class="mini" id="rst" title="Chơi lại từ đầu" aria-label="Chơi lại">🔄</button>
  <button class="mini" id="snd" title="Bật/tắt âm thanh" aria-label="Bật tắt âm thanh">🔊</button>

  <div id="ov">
    <button class="back" id="back">⬅ Quay lại</button>
    <div id="ttl"></div>
    <div id="zone">
      <div id="bagwrap"><div class="half l"></div><div class="half r"></div></div>
      <div id="words"></div>
    </div>
    <div id="spell"></div>
    <div id="msg">Cả lớp cùng đọc nào! 📣</div>
    <div id="acts">
      <button class="btn say" id="say">🔊 Nghe đọc</button>
      <button class="btn" id="next">🎁 Chọn túi khác</button>
    </div>
  </div>

  <div id="end">
    <h1>🎉 Cả lớp giỏi quá! 🎉</h1>
    <p>Các em đã mở hết 4 túi mù và đọc đúng các chữ!</p>
    <div id="chips"></div>
    <button class="btn" id="again">🔄 Chơi lại</button>
  </div>
</div>

<script>
/* ===== DỮ LIỆU: thầy/cô sửa nội dung ở đây ===== */
const BAGS = [
  { words: [{t:"thủ",s:["thờ","u","thu","hỏi","thủ"]}, {t:"đô",s:["đờ","ô","đô"]}],
    c: "#ff4fa3", t: "#ffffff", pos: [4.0, 46.8, 23.0, 41.5] },
  { words: [{t:"lá",s:["lờ","a","la","sắc","lá"]}, {t:"thư",s:["thờ","ư","thư"]}],
    c: "#1e90ff", t: "#ffffff", pos: [27.5, 46.8, 22.5, 41.5] },
  { words: [{t:"thìa",s:["thờ","ia","thia","huyền","thìa"]}, {t:"dĩa",s:["dờ","ia","dia","ngã","dĩa"]}],
    c: "#ffc400", t: "#5b3a00", pos: [50.3, 46.8, 22.5, 41.5] },
  { words: [{t:"lá",s:["lờ","a","la","sắc","lá"]}, {t:"tía",s:["tờ","ia","tia","sắc","tía"]}, {t:"tô",s:["tờ","ô","tô"]}],
    c: "#2fc12f", t: "#ffffff", pos: [73.3, 46.8, 22.5, 41.5] }
];
/* ================================================= */
const $ = id => document.getElementById(id);
const BAG_SVG = `<svg viewBox="0 0 200 230" width="100%" height="100%"><path d="M45 85C8 125 2 200 40 215Q100 235 160 215C198 200 192 125 155 85Z" fill="var(--c)" stroke="#fff" stroke-width="6"/><path d="M58 88Q55 50 32 30Q70 12 100 38Q130 12 168 30Q145 50 142 88Z" fill="var(--c)" stroke="#fff" stroke-width="6"/><ellipse cx="60" cy="150" rx="12" ry="30" fill="#fff" opacity=".35" transform="rotate(15 60 150)"/><path d="M60 92Q100 112 140 92" stroke="#ffd23f" stroke-width="12" fill="none" stroke-linecap="round"/><ellipse cx="78" cy="96" rx="22" ry="12" fill="#ffd23f" stroke="#fff" stroke-width="3"/><ellipse cx="122" cy="96" rx="22" ry="12" fill="#ffd23f" stroke="#fff" stroke-width="3"/><circle cx="100" cy="100" r="9" fill="#ffb300" stroke="#fff" stroke-width="3"/><text x="100" y="190" text-anchor="middle" font-size="90" font-weight="900" fill="#fff" stroke="#7b2cbf" stroke-width="5" paint-order="stroke" font-family="Arial,sans-serif">?</text></svg>`;
document.querySelectorAll(".half").forEach(h => h.innerHTML = BAG_SVG);

let reading = false, rtoken = 0, opened = new Set(), busy = false, token = 0, sound = true, ctx = null, cur = -1;
const sleep = ms => new Promise(r => setTimeout(r, ms));

/* ---- Âm thanh (Web Audio, chỉ phát sau thao tác) ---- */
function audio() { if (!ctx) { try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (ctx && ctx.state === "suspended") ctx.resume(); return ctx; }
function tone(f, d, type = "sine", delay = 0, vol = 0.15) {
  if (!sound || !audio()) return;
  const o = ctx.createOscillator(), g = ctx.createGain(), t = ctx.currentTime + delay;
  o.type = type; o.frequency.value = f; g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + d);
  o.connect(g); g.connect(ctx.destination); o.start(t); o.stop(t + d);
}
function tearSound() {
  if (!sound || !audio()) return;
  const n = ctx.sampleRate * 0.35, b = ctx.createBuffer(1, n, ctx.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
  f.type = "highpass"; f.frequency.value = 1500; g.gain.value = 0.22; s.buffer = b; s.connect(f); f.connect(g); g.connect(ctx.destination); s.start();
}
const sfxShake = () => [0, .22, .44, .66].forEach((t, i) => tone(300 + i * 40, .12, "triangle", t, .1));
const sfxPop = i => { tone(520 + i * 140, .25, "sine", 0, .18); tone(780 + i * 140, .25, "sine", .08, .12); };
const sfxWin = () => [523, 659, 784, 1047].forEach((f, i) => tone(f, .35, "sine", i * .14, .16));

function burst() {
  const st = $("stage"), em = ["⭐", "✨", "🎉", "💖", "🌟", "🎈"];
  for (let i = 0; i < 18; i++) {
    const s = document.createElement("span"); s.className = "fx"; s.textContent = em[i % em.length];
    const a = Math.random() * Math.PI * 2, r = 12 + Math.random() * 22;
    s.style.setProperty("--dx", Math.cos(a) * r + "cqw"); s.style.setProperty("--dy", Math.sin(a) * r * 0.7 + "cqw"); s.style.setProperty("--r", (Math.random() * 720 - 360) + "deg");
    st.appendChild(s); setTimeout(() => s.remove(), 1400);
  }
}

/* ---- Tạo vùng bấm trên 4 túi ---- */
BAGS.forEach((b, i) => {
  const el = document.createElement("button");
  el.className = "bag"; el.id = "bag" + i; el.setAttribute("aria-label", "Túi mù số " + (i + 1));
  el.style.cssText = `left:${b.pos[0]}%;top:${b.pos[1]}%;width:${b.pos[2]}%;height:${b.pos[3]}%`;
  el.onclick = () => openBag(i);
  $("bags").appendChild(el);
});

/* ---- Mở túi ---- */
async function openBag(i) {
  if (busy) return; busy = true; cur = i; const my = ++token; audio();
  const b = BAGS[i], ov = $("ov"), bw = $("bagwrap");
  ov.style.setProperty("--c", b.c); ov.style.setProperty("--t", b.t);
  $("ttl").textContent = "Túi số " + (i + 1); $("words").innerHTML = ""; $("spell").innerHTML = ""; $("say").disabled = false;
  bw.classList.remove("shake", "tear"); $("msg").classList.remove("on"); $("acts").classList.remove("on");
  ov.classList.add("on");
  await sleep(450); if (my !== token) return;
  void bw.offsetWidth; bw.classList.add("shake"); sfxShake();
  await sleep(950); if (my !== token) return;
  tearSound(); bw.classList.add("tear"); burst();
  await sleep(600); if (my !== token) return;
  const card = document.createElement("div"); card.className = "card";
  card.innerHTML = b.words.map(w => `<span class="w">${w.t}</span>`).join(" ");
  $("words").appendChild(card); sfxPop(1); burst();
  await sleep(900); if (my !== token) return;
  opened.add(i);
  $("next").textContent = opened.size === BAGS.length ? "🎉 Xong rồi!" : "🎁 Chọn túi khác";
  $("msg").classList.add("on"); $("acts").classList.add("on"); tone(880, .3, "sine", 0, .12);
  busy = false;
}
function vanish() {
  opened.forEach(i => {
    const el = $("bag" + i); if (el.classList.contains("done")) return;
    const p = BAGS[i].pos;
    el.style.backgroundSize = `${10000 / p[2]}% ${10000 / p[3]}%`;
    el.style.backgroundPosition = `${p[0] / (100 - p[2]) * 100}% ${p[1] / (100 - p[3]) * 100}%`;
    el.classList.add("done"); el.disabled = true;
  });
}
function closeOv() {
  token++; rtoken++; busy = false; reading = false;
  try { speechSynthesis.cancel(); } catch (e) {}
  $("ov").classList.remove("on"); vanish();
}
$("back").onclick = closeOv;
function say(text) {
  if (sound && "speechSynthesis" in window) return new Promise(res => {
    let d = false; const fin = () => { if (!d) { d = true; res(); } };
    try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.lang = "vi-VN"; u.rate = 0.75; u.onend = fin; u.onerror = fin; setTimeout(fin, 4000); speechSynthesis.speak(u); } catch (e) { fin(); }
  });
  return sleep(600 + text.length * 60);
}
async function readAloud() {
  if (reading || cur < 0) return; reading = true; const my = ++rtoken; audio(); $("say").disabled = true;
  const b = BAGS[cur], ws = document.querySelectorAll("#words .w"), sp = $("spell"), phrase = b.words.map(w => w.t).join(" ");
  for (let k = 0; k < b.words.length; k++) {                    // 1) đánh vần từng tiếng
    ws.forEach((e, j) => e.classList.toggle("hl", j === k));
    sp.innerHTML = b.words[k].s.map(x => `<span>${x}</span>`).join("");
    for (let j = 0; j < sp.children.length; j++) {
      sp.children[j].classList.add("on"); await say(b.words[k].s[j]); if (my !== rtoken) return;
      sp.children[j].classList.remove("on");
    }
    await sleep(300); if (my !== rtoken) return;
  }
  ws.forEach(e => e.classList.add("hl"));                       // 2) đọc trơn cả cụm
  sp.innerHTML = `<span class="on">${phrase}</span>`; await say(phrase); if (my !== rtoken) return;
  ws.forEach(e => e.classList.remove("hl")); reading = false; $("say").disabled = false;
}
$("say").onclick = readAloud;
$("next").onclick = () => {
  closeOv(); // túi vừa đọc xong sẽ biến mất
  if (opened.size === BAGS.length) {
    $("chips").innerHTML = ""; BAGS.forEach(b => { const s = document.createElement("span"); s.textContent = b.words.map(w => w.t).join(" "); s.style.cssText = `--c:${b.c};--t:${b.t}`; $("chips").appendChild(s); });
    $("end").classList.add("on"); sfxWin(); burst();
  }
};
function resetGame() {
  token++; busy = false; opened.clear(); cur = -1;
  document.querySelectorAll(".bag").forEach(e => { e.classList.remove("done"); e.disabled = false; e.style.backgroundSize = e.style.backgroundPosition = ""; });
  rtoken++; reading = false;
  $("ov").classList.remove("on"); $("end").classList.remove("on");
}
$("again").onclick = resetGame; $("rst").onclick = resetGame;
$("snd").onclick = () => { sound = !sound; $("snd").textContent = sound ? "🔊" : "🔇"; if (!sound && "speechSynthesis" in window) speechSynthesis.cancel(); };
</script>
</body>
